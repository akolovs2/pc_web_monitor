services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      network: host
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
